<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Framely SaaS landing page placeholder screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F3A42"/>
      <stop offset="1" stop-color="#123B33"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C883"/>
      <stop offset="1" stop-color="#10A6A0"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#bg)"/>

  <g transform="translate(56,32)">
    <rect x="0" y="0" width="528" height="272" rx="14" fill="#0D131B" stroke="#2A3542" stroke-width="2"/>
    <rect x="0" y="0" width="528" height="34" rx="14" fill="#151D28"/>
    <circle cx="17" cy="17" r="4" fill="#3A4553"/><circle cx="33" cy="17" r="4" fill="#3A4553"/><circle cx="49" cy="17" r="4" fill="#3A4553"/>
    <rect x="420" y="10" width="90" height="14" rx="7" fill="url(#brand)" opacity="0.8"/>

    <!-- hero -->
    <rect x="60" y="70" width="240" height="14" rx="4" fill="#EEF2F6" opacity="0.85"/>
    <rect x="60" y="94" width="180" height="14" rx="4" fill="url(#brand)"/>
    <rect x="60" y="126" width="260" height="8" rx="4" fill="#3A4553"/>
    <rect x="60" y="140" width="200" height="8" rx="4" fill="#242E3A"/>
    <rect x="60" y="164" width="118" height="30" rx="15" fill="url(#brand)"/>
    <rect x="188" y="164" width="90" height="30" rx="15" fill="none" stroke="#3A4553"/>

    <!-- device mock -->
    <g transform="translate(350,64)">
      <rect width="140" height="150" rx="12" fill="#151D28" stroke="#2A3542"/>
      <rect x="12" y="14" width="116" height="60" rx="8" fill="url(#brand)" opacity="0.3"/>
      <rect x="12" y="86" width="80" height="8" rx="4" fill="#3A4553"/>
      <rect x="12" y="102" width="100" height="6" rx="3" fill="#242E3A"/>
      <rect x="12" y="120" width="60" height="18" rx="9" fill="url(#brand)"/>
    </g>

    <rect x="60" y="222" width="408" height="1" fill="#242E3A"/>
    <rect x="60" y="238" width="60" height="7" rx="3.5" fill="#3A4553"/>
    <rect x="160" y="238" width="60" height="7" rx="3.5" fill="#3A4553"/>
    <rect x="260" y="238" width="60" height="7" rx="3.5" fill="#3A4553"/>
  </g>

  <text x="28" y="340" font-family="'JetBrains Mono', monospace" font-size="13" fill="#8FA6A0">// framely — preview</text>
