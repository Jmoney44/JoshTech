<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Ledger invoicing app placeholder screen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123B33"/>
      <stop offset="1" stop-color="#1B4A3E"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22C883"/>
      <stop offset="1" stop-color="#10A6A0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>

  <!-- browser window -->
  <g transform="translate(60,50)">
    <rect x="0" y="0" width="520" height="300" rx="14" fill="#0D131B" stroke="#2A3542" stroke-width="2"/>
    <rect x="0" y="0" width="520" height="32" rx="14" fill="#151D28"/>
    <circle cx="18" cy="16" r="4" fill="#3A4553"/>
    <circle cx="34" cy="16" r="4" fill="#3A4553"/>
    <circle cx="50" cy="16" r="4" fill="#3A4553"/>

    <!-- sidebar -->
    <rect x="0" y="32" width="120" height="268" fill="#101720"/>
    <rect x="18" y="54" width="70" height="9" rx="4.5" fill="url(#brand)"/>
    <rect x="18" y="86" width="84" height="7" rx="3.5" fill="#2A3542"/>
    <rect x="18" y="106" width="70" height="7" rx="3.5" fill="#242E3A"/>
    <rect x="18" y="126" width="78" height="7" rx="3.5" fill="#242E3A"/>
    <rect x="18" y="146" width="60" height="7" rx="3.5" fill="#242E3A"/>

    <!-- stat cards -->
    <g>
      <rect x="136" y="50" width="112" height="60" rx="8" fill="#151D28" stroke="#242E3A"/>
      <rect x="150" y="64" width="50" height="7" rx="3.5" fill="#3A4553"/>
      <rect x="150" y="80" width="34" height="12" rx="4" fill="url(#brand)" opacity="0.85"/>

      <rect x="258" y="50" width="112" height="60" rx="8" fill="#151D28" stroke="#242E3A"/>
      <rect x="272" y="64" width="50" height="7" rx="3.5" fill="#3A4553"/>
      <rect x="272" y="80" width="34" height="12" rx="4" fill="#2A3542"/>

      <rect x="380" y="50" width="112" height="60" rx="8" fill="#151D28" stroke="#242E3A"/>
      <rect x="394" y="64" width="50" height="7" rx="3.5" fill="#3A4553"/>
      <rect x="394" y="80" width="34" height="12" rx="4" fill="url(#brand)" opacity="0.55"/>
    </g>

    <!-- chart bars -->
    <g>
      <rect x="136" y="128" width="356" height="90" rx="8" fill="#151D28" stroke="#242E3A"/>
      <rect x="154" y="176" width="18" height="30" rx="3" fill="url(#brand)" opacity="0.5"/>
      <rect x="182" y="160" width="18" height="46" rx="3" fill="url(#brand)" opacity="0.65"/>
      <rect x="210" y="146" width="18" height="60" rx="3" fill="url(#brand)" opacity="0.8"/>
      <rect x="238" y="168" width="18" height="38" rx="3" fill="url(#brand)" opacity="0.6"/>
      <rect x="266" y="152" width="18" height="54" rx="3" fill="url(#brand)"/>
      <rect x="294" y="180" width="18" height="26" rx="3" fill="url(#brand)" opacity="0.5"/>
      <path d="M154 190 182 172 210 158 238 178 266 162 294 194" fill="none" stroke="#EEF2F6" stroke-width="1.5" opacity="0.5"/>
    </g>

    <!-- table rows -->
    <g>
      <rect x="136" y="230" width="356" height="56" rx="8" fill="#151D28" stroke="#242E3A"/>
      <rect x="150" y="242" width="120" height="7" rx="3.5" fill="#3A4553"/>
      <rect x="410" y="242" width="60" height="7" rx="3.5" fill="url(#brand)" opacity="0.7"/>
      <rect x="150" y="260" width="100" height="6" rx="3" fill="#242E3A"/>
      <rect x="410" y="260" width="60" height="6" rx="3" fill="#242E3A"/>
